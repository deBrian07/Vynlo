name = "vynlo-tracking"
main = "src/index.ts"
compatibility_date = "2026-10-22"
workers_dev = true

# Keep payloads, pixel URLs and credentials out of Worker observability logs.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "vynlo-tracking"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[[ratelimits]]
name = "PIXEL_LIMITER"
namespace_id = "11201"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "11202"
simple = { limit = 120, period = 60 }
